  <!-- Google Ads dönüşüm takibi: telefon ve WhatsApp tıklamaları -->
  <script>
    (function () {
      var AW_ID = 'AW-18525634687';
      var PHONE_LABEL = 'R_CHCLuGgawdEP-A24FF';

      function report(label) {
        if (!label || label.indexOf('BURAYA_') === 0) return;
        if (typeof window.gtag !== 'function') return;
        window.gtag('event', 'conversion', {
          send_to: AW_ID + '/' + label,
          value: 1.0,
          currency: 'TRY'
        });
      }

      document.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== document && el.tagName !== 'A') el = el.parentNode;
        if (!el || el === document) return;

        var href = (el.getAttribute('href') || '').toLowerCase();
        if (href.indexOf('tel:') === 0) {
          report(PHONE_LABEL);
        }
      }, true);
    })();
